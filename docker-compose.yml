services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: intel_map
    ports:
      - '5432:5432'
    volumes:
      - intel-map-postgres-data:/var/lib/postgresql/data

volumes:
  intel-map-postgres-data:
